name: CI

on:
  push:
    branches:
      - main
      - lab3
      - lab3tests
      - lab4db
      - lab6CICD
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make scripts executable
        run: chmod +x ./build.sh ./run.sh ./test.sh

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./test.sh

      - name: Upload app.jar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/app.jar
