name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          chmod +x scripts/*.sh
      

      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: build/kotlin-1.9.24
          key: kotlin-compiler-1.9.24

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build
        run: scripts/build.sh

      - name: Unit tests (JUnit)
        run: scripts/unit-test.sh

      - name: App tests
        run: scripts/test.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wump:${{ github.run_number }},${{ secrets.DOCKERHUB_USERNAME }}/wump:latest

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Auto Release #${{ github.run_number }}"
          body: |
            Docker image:
            ${{ secrets.DOCKERHUB_USERNAME }}/wump:${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Telegram notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ CD OK: ${{ github.repository }} v${{ github.run_number }} (pushed Docker + release)"
          else
            MSG="❌ CD FAIL: ${{ github.repository }} v${{ github.run_number }}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MSG"
